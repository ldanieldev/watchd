name: ci

on: push

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the bun version from package.json "packageManager"
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test --run

  docker:
    needs: [ci]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/ldanieldev/watchd
          flavor: latest=false
          tags: type=semver,pattern={{version}}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            SENTRY_DSN=${{ vars.SENTRY_DSN }}
            SENTRY_UPLOAD_SOURCEMAPS=${{ case(vars.SENTRY_ORG != '', 'true', 'false') }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
          secrets: sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Image serves no source maps
        run: |
          count=$(docker run --rm --entrypoint sh "${{ steps.meta.outputs.tags }}" -c 'find .output/public -name "*.map" | wc -l')
          test "$count" -eq 0

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            SENTRY_DSN=${{ vars.SENTRY_DSN }}
            SENTRY_UPLOAD_SOURCEMAPS=${{ case(vars.SENTRY_ORG != '', 'true', 'false') }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
          secrets: sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
