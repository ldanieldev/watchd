services:
  postgres:
    image: docker.io/library/postgres:18.7-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-watchd}
      INNGEST_SCHEMA: ${INNGEST_SCHEMA:-inngest}
    volumes:
      - postgres_data:/var/lib/postgresql
      # initdb.d runs only on an empty volume, so a populated one needs a teardown to pick this up
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-watchd}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: docker.io/library/redis:8.10.3-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.57.0
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      # Without this, a new image tag refuses to open the existing database; a no-op once it matches.
      MEILI_UPGRADE_DB: "true"
    volumes:
      - meili_data:/meili_data

  inngest:
    image: docker.io/inngest/inngest:v1.53.0
    # Syncs bun dev once at Inngest start, retrying each poll until it answers; later job changes still need the PUT.
    command: ["inngest", "start", "--sdk-url", "http://host.docker.internal:3000/api/inngest", "--poll-interval", "60"]
    ports:
      - "127.0.0.1:8288:8288"
      - "127.0.0.1:8289:8289"
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-deadbeefdeadbeef}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-cafebabecafebabe}
      INNGEST_POSTGRES_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-watchd}?search_path=${INNGEST_SCHEMA:-inngest}
      INNGEST_REDIS_URI: ${REDIS_URL:-redis://redis:6379}
    # initdb makes the first boot slow enough that plain start-ordering loses the race
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  alloy:
    image: docker.io/grafana/alloy:v1.22.0
    security_opt:
      - label=disable
    environment:
      MIMIR_PUSH_URL: ${MIMIR_PUSH_URL}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:4318:4318" # OTLP HTTP (app metrics)
      - "127.0.0.1:12345:12345" # Alloy UI / health
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:Z,ro
      - ./logs:/logs:ro

  # Redis UI only; Postgres is covered by `drizzle-kit studio`.
  redisinsight:
    image: docker.io/redis/redisinsight:3.10.1
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    environment:
      # Resolved by the container, not the browser, so this is the service name
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: watchd
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

  playwright:
    image: mcr.microsoft.com/playwright:v1.65.1-jammy
    profiles: ["test"]
    working_dir: /work
    env_file:
      - .env
    environment:
      BUN_INSTALL: /root/.bun
      PATH: /root/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CI: "true"
    volumes:
      - .:/work:Z
      - playwright_bun:/root/.bun
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      inngest:
        condition: service_started
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        if ! command -v bun >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq unzip
          curl -fsSL https://bun.sh/install | bash
        fi
        bun install --frozen-lockfile
        exec bun "$@"
      - bash
    command: ["test:e2e"]

volumes:
  postgres_data:
  redis_data:
  meili_data:
  redisinsight_data:
  playwright_bun:
